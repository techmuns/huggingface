# Weekly pipeline trigger.
#
# Repairing several weeks? Dispatch this once PER WEEK. A Workflow instance
# has a CPU/memory budget for the orchestration itself, which Workflows
# replays from the top at every step boundary, so cost grows with the NUMBER
# of steps and a wide run used to be killed outright with WorkflowFatalError
# ("exceeded CPU or memory limits outside of a step"). Two runs died that way.
#
# It can no longer be fatal: the step budget in src/workflow.ts is a set of
# fixed per-stage shares that sum inside the ceiling, and it takes no backfill
# depth, so asking for more weeks cannot ask for more steps. A wide dispatch
# now covers what it can and reports `truncated` instead of dying. One week at
# a time is still the way to repair history — it is what the shares are sized
# for — but getting it wrong costs coverage rather than the whole run.
#
# Cloudflare caps the Workers Free plan at 5 cron triggers per account and all
# five are in use, so the schedule lives here instead. This calls the same
# admin endpoint the Cloudflare cron would have, on the same schedule, and
# costs nothing.
name: Weekly pipeline

on:
  schedule:
    # 00:30 UTC Monday = 06:00 IST Monday. GitHub may delay scheduled runs
    # under load; the week is computed from the calendar rather than from the
    # firing time, so a late run still processes the right week.
    - cron: "30 0 * * 1"
  workflow_dispatch:
    inputs:
      weekStart:
        description: "Monday to process (YYYY-MM-DD). Blank = last complete week."
        required: false
      backfillWeeks:
        description: "Weeks to process. Keep at 1 — see note. Above 3 will fail."
        required: false
        default: "1"
      dryRun:
        description: "Skip the GitHub snapshot commit"
        type: boolean
        required: false
        default: false

# The keepalive step writes one small file per run through the Contents API.
permissions:
  contents: write

concurrency:
  # Two runs writing the same weeks would double the D1 write cost and can
  # interleave badly. Never run two at once, and never cancel one mid-flight.
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - name: Work out which week to process
        id: week
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.weekStart }}" ]; then
            WEEK="${{ github.event.inputs.weekStart }}"
          else
            # Monday of the current week, then step back one week. Derived from
            # the calendar rather than "7 days ago" so a delayed run still
            # lands on a Monday.
            DOW=$(date -u +%u)                                   # 1=Mon .. 7=Sun
            THIS_MON=$(date -u -d "-$((DOW - 1)) days" +%Y-%m-%d)
            WEEK=$(date -u -d "$THIS_MON -7 days" +%Y-%m-%d)
          fi
          # The scheduled run is always exactly one week: the one that just
          # closed. Backfill depth is an operator's tool for repairing history,
          # never something the cron reaches for — a wider window multiplies Hub
          # requests and Bedrock spend, and re-processes weeks that are already
          # correct. Pinned on the event rather than left to the empty-input
          # fallback, so changing the dispatch default cannot widen the cron.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BACKFILL=1
          else
            BACKFILL="${{ github.event.inputs.backfillWeeks || 1 }}"
          fi

          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "backfill=$BACKFILL" >> "$GITHUB_OUTPUT"
          echo "Processing week of $WEEK (backfillWeeks=$BACKFILL)"

      - name: Check the database schema matches the deployed code
        env:
          BASE: ${{ secrets.WORKER_URL }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # `git push` deploys the Worker; a human applies the migration. When
          # those two drift, parse fails on a missing column a third of the way
          # into the run, after the D1 writes have already been spent. Catch it
          # here, before anything is written, and say which migration is owed.
          BASE="${BASE:-https://huggingface.tech-441.workers.dev}"
          S=$(curl -sS --max-time 30 "$BASE/api/admin/stats" -H "Authorization: Bearer $TOKEN")
          if [ "$(echo "$S" | jq -r '.schema.ok // "absent"')" = "false" ]; then
            echo "::error::Database is missing columns the deployed code writes: \
          $(echo "$S" | jq -r '.schema.missingColumns | join(", ")'). \
          Apply the pending migration in migrations/ before this run."
            exit 1
          fi

      - name: Check the deployed Worker is not older than this commit
        env:
          BASE: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          # A push and its Cloudflare deploy are minutes apart. A run started
          # inside that gap executes the PREVIOUS version, and its failure gets
          # blamed on code that was already fixed — which happened today, twice,
          # and cost hours of misdirected debugging. Refuse to draw a
          # conclusion from a run against stale code.
          BASE="${BASE:-https://huggingface.tech-441.workers.dev}"
          DEPLOYED=$(curl -sS --max-time 30 "$BASE/health" | jq -r '.deployedAt // empty')
          COMMIT="${{ github.event.head_commit.timestamp || '' }}"

          if [ -z "$DEPLOYED" ]; then
            echo "Worker does not report a deploy time yet; skipping the freshness check."
          elif [ -n "$COMMIT" ] && [ "$(date -u -d "$DEPLOYED" +%s)" -lt "$(date -u -d "$COMMIT" +%s)" ]; then
            echo "::error::The live Worker was deployed at $DEPLOYED, before this commit \
          ($COMMIT). The run would execute the previous version. Wait for the Cloudflare \
          build to finish and dispatch again."
            exit 1
          else
            echo "Live Worker deployed at $DEPLOYED — not older than this commit."
          fi

      - name: Start the run
        id: start
        env:
          BASE: ${{ secrets.WORKER_URL }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::ADMIN_TOKEN secret is not set"; exit 1; }
          BASE="${BASE:-https://huggingface.tech-441.workers.dev}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          # Query string, not a JSON body. Three runs sent a correct body with
          # `-H 'content-type: application/json'` and the Worker reported
          # seeing content-type "(none)" every time — the header does not
          # survive the trip, and whatever drops it is not in this repo. Two of
          # those runs then processed the wrong week for an hour before anyone
          # noticed. Parameters in the URL have no header to lose.
          Q="weekStart=${{ steps.week.outputs.week }}"
          Q="$Q&backfillWeeks=${{ steps.week.outputs.backfill }}"
          Q="$Q&dryRun=${{ github.event.inputs.dryRun || false }}"

          for attempt in 1 2 3; do
            RESP=$(curl -sS --max-time 60 -X POST "$BASE/api/admin/run?$Q" \
              -H "Authorization: Bearer $TOKEN") && break
            echo "attempt $attempt failed; retrying"; sleep $((attempt * 10))
          done

          echo "$RESP"
          ID=$(echo "$RESP" | jq -r '.id // empty')
          [ -n "$ID" ] || { echo "::error::could not start run: $RESP"; exit 1; }

          # Confirm the Worker actually took the week we asked for. It answers
          # 202 with the params it accepted; twice now that came back {} while
          # the body was correct, and the run silently processed the current
          # week instead. A 202 is not evidence the request was honoured — the
          # echo is. Fail here rather than spend an hour on the wrong week.
          GOT=$(echo "$RESP" | jq -r '.params.weekStart // empty')
          if [ "$GOT" != "${{ steps.week.outputs.week }}" ]; then
            echo "::error::Worker accepted weekStart='$GOT' but we sent \
          '${{ steps.week.outputs.week }}'. The run would process the wrong week. \
          Full response: $RESP"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wait for it to finish
        env:
          BASE: ${{ steps.start.outputs.base }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ID: ${{ steps.start.outputs.id }}
        run: |
          set -uo pipefail
          # 700 x 30s = up to 350 minutes. A single week took 61 minutes, and
          # a multi-week backfill is now worth dispatching: the account is on
          # Workers Paid, so 10,000 workflow steps rather than 1,024 means
          # Cloudflare is no longer the binding constraint — this poll ceiling
          # was. Exiting early here reports failure for a run that is still
          # healthy, and invites terminating it.
          for i in $(seq 1 700); do
            STATUS=$(curl -sS --max-time 30 "$BASE/api/admin/run/$ID" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.status.status // "unknown"')
            case "$STATUS" in
              complete)
                echo "Run complete."; exit 0 ;;
              errored|terminated)
                echo "::error::Run $STATUS"
                curl -sS --max-time 30 "$BASE/api/admin/run/$ID" \
                  -H "Authorization: Bearer $TOKEN" | jq '.status.error'
                exit 1 ;;
            esac
            # Progress every 5 minutes, so a stalled stage is visible in the log
            # rather than looking identical to a slow one.
            if [ $((i % 10)) -eq 0 ]; then
              echo "[$((i / 2)) min] $STATUS — $(curl -sS --max-time 30 "$BASE/api/admin/stats" \
                -H "Authorization: Bearer $TOKEN" | jq -r '.stage')"
            fi
            sleep 30
          done
          echo "::error::Timed out after 350 minutes; run $ID may still be going"
          exit 1

      # ── Keep the schedule alive ──────────────────────────────────────────
      #
      # GitHub disables a scheduled workflow after 60 days with no repository
      # activity, silently. A SUCCESSFUL run already commits its weekly
      # snapshot, which resets that clock — but the clock only ever matters
      # when runs are FAILING, and a failing run commits nothing. The two
      # compound: the pipeline breaks, nothing is committed, and sixty days
      # later the schedule that would have retried it is switched off as well.
      # Nobody is told, and the dashboard simply stops at whatever week it last
      # managed — which looks identical to a quiet quarter on the Hub.
      #
      # One small file a week, written whatever the outcome, resets the clock
      # and leaves a git-visible record of every run. Written through the
      # Contents API rather than a checkout and push, so there is no working
      # tree to conflict and no branch to protect against.
      # The archive is Phase 8 and the week is already written by Phase 7, so a
      # failed archive no longer fails the run — see src/workflow.ts. It must
      # still be impossible to miss: raw-record pruning is documented to assume
      # the archive exists, so a quiet skip here is how that assumption would
      # come to be untrue.
      - name: Warn if the weekly archive did not land
        if: success()
        env:
          BASE: ${{ steps.start.outputs.base }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ID: ${{ steps.start.outputs.id }}
        run: |
          set -uo pipefail
          OUT=$(curl -sS --max-time 30 "$BASE/api/admin/run/$ID" -H "Authorization: Bearer $TOKEN")
          COMMITTED=$(echo "$OUT" | jq -r '.status.output.snapshot.committed // "absent"')
          if [ "$COMMITTED" = "false" ]; then
            echo "::warning::The week's figures are written and the dashboard is \
          updated, but the GitHub archive did NOT commit: \
          $(echo "$OUT" | jq -r '.status.output.snapshot.error // "no reason given"'). \
          Raw-record retention assumes this archive exists — fix the Worker's \
          GITHUB_TOKEN (it needs Contents: Read and write) before relying on it."
          fi

      - name: Warn if family resolution did not finish its walk
        if: success()
        env:
          BASE: ${{ steps.start.outputs.base }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ID: ${{ steps.start.outputs.id }}
        run: |
          set -uo pipefail
          OUT=$(curl -sS --max-time 30 "$BASE/api/admin/run/$ID" -H "Authorization: Bearer $TOKEN")
          DONE=$(echo "$OUT" | jq -r '.status.output.resolve.done // "absent"')
          if [ "$DONE" = "false" ]; then
            echo "::warning::Model-family resolution ran out of passes before \
          walking its whole set. Rungs still walking: \
          $(echo "$OUT" | jq -r '.status.output.resolve.unfinished // [] | join(", ")'). \
          Models past the point each cursor reached were never examined this \
          run and are published as Unresolved, which is indistinguishable from \
          a model that was checked and could not be placed. The resolve loop \
          re-walks the whole accumulated corpus every week from an empty \
          cursor, so this warning appears once the corpus outgrows \
          MAX_RESOLVE_PASSES x RESOLVE_PAGE and does not go away on its own."
          fi

      - name: Record the run, and keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WEEK: ${{ steps.week.outputs.week }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          FILE="data/runs/${WEEK}.json"
          API="https://api.github.com/repos/${REPO}/contents/${FILE}"

          BODY=$(jq -nc \
            --arg w "$WEEK" --arg o "$OUTCOME" --arg u "$RUN_URL" \
            --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{week:$w, outcome:$o, finishedAt:$t, run:$u}')

          # Re-running a week overwrites its record rather than failing, so a
          # repair leaves the outcome that actually stands.
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API" | jq -r '.sha // empty')

          PAYLOAD=$(jq -nc \
            --arg m "chore(run): week of ${WEEK} — ${OUTCOME}" \
            --arg c "$(printf '%s' "$BODY" | base64 -w0)" \
            --arg s "$SHA" \
            '{message:$m, content:$c} + (if $s == "" then {} else {sha:$s} end)')

          CODE=$(curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" "$API" \
            -d "$PAYLOAD" -o /tmp/keepalive.json -w '%{http_code}')

          # A failure here must not turn a green pipeline run red — but it must
          # be visible, because the thing it protects against is invisible.
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::warning::Could not write $FILE (HTTP $CODE). The 60-day \
          schedule-inactivity clock was NOT reset by this run: \
          $(jq -r '.message // empty' /tmp/keepalive.json)"
          else
            echo "Recorded $FILE — schedule inactivity clock reset."
          fi

      - name: Report
        if: always()
        env:
          BASE: ${{ steps.start.outputs.base }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          {
            echo "### Week of ${{ steps.week.outputs.week }}"
            echo '```json'
            curl -sS --max-time 30 "$BASE/api/admin/stats" -H "Authorization: Bearer $TOKEN" | jq '.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
